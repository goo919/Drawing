# 매일 자정(KST 00:05)에 카카오톡으로 "오늘의 주제 도착" 알림을 보냅니다.
# 시크릿(KAKAO_REST_KEY, KAKAO_REFRESH_A, KAKAO_REFRESH_B)이 없으면 조용히 건너뜁니다.
# 설정 방법: README.md 의 "카카오톡 아침 알림" 섹션
name: KakaoTalk daily reminder

on:
  schedule:
    - cron: "5 15 * * *" # 15:05 UTC = 00:05 KST
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Send KakaoTalk reminders
        env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          KAKAO_REFRESH_A: ${{ secrets.KAKAO_REFRESH_A }}
          KAKAO_REFRESH_B: ${{ secrets.KAKAO_REFRESH_B }}
        run: node scripts/kakao-notify.mjs
