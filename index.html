<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>우리만의 상상 수족관</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐟</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <h1 class="app-title">우리만의 상상 수족관</h1>
    <div class="header-right">
      <span id="mode-badge" class="mode-badge"></span>
      <button type="button" id="me-chip" class="me-chip" hidden></button>
      <button type="button" id="btn-switch-user" class="icon-btn" title="프로필 바꾸기" aria-label="프로필 바꾸기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
      </button>
    </div>
  </header>

  <main>
    <!-- ============ 오늘의 그림 ============ -->
    <section id="tab-today" class="tab-panel">
      <div class="topic-card">
        <div class="topic-label">오늘의 주제 · <span id="today-date"></span></div>
        <h2 id="today-topic" class="topic-text"></h2>
      </div>

      <div id="today-status" class="status-row"></div>

      <div id="draw-area">
        <div class="toolbar">
          <div class="tool-row">
            <div id="palette" class="palette"></div>
            <label class="pastel-switch" title="파스텔톤으로 전환">
              <input type="checkbox" id="pastel-toggle">
              <span class="switch-track"><span class="switch-thumb"></span></span>
              <span class="switch-label">파스텔</span>
            </label>
          </div>
          <div class="tool-row">
            <label class="brush-control">
              <span class="tool-label">굵기</span>
              <input type="range" id="brush-size" min="2" max="34" value="8">
              <span id="brush-label" class="brush-num">8</span>
            </label>
            <div class="tool-btns">
              <button type="button" id="btn-eraser" class="tool-btn" title="지우개" aria-label="지우개">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 4.5l6 6L10 20H5.5l-2-2 10-13.5z"/><path d="M8 20h13"/></svg>
              </button>
              <button type="button" id="btn-undo" class="tool-btn" title="실행 취소" aria-label="실행 취소">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6l-4 4 4 4"/><path d="M4 10h9a5 5 0 0 1 0 10h-3"/></svg>
              </button>
              <button type="button" id="btn-clear" class="tool-btn" title="전체 지우기" aria-label="전체 지우기">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13M10 11v5M14 11v5"/></svg>
              </button>
              <button type="button" id="btn-zoom-out" class="tool-btn" title="축소" aria-label="축소">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg>
              </button>
              <span id="zoom-label" class="zoom-label">100%</span>
              <button type="button" id="btn-zoom-in" class="tool-btn" title="확대" aria-label="확대">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
              </button>
            </div>
          </div>
        </div>

        <div id="canvas-viewport" class="canvas-viewport">
          <canvas id="draw-canvas"></canvas>
        </div>

        <button type="button" id="btn-submit" class="btn primary submit-btn">완료! 수족관에 풀어주기</button>
        <p class="hint">제출하면 수정할 수 없어요. 상대방도 제출해야 서로의 그림이 공개됩니다.</p>
      </div>

      <div id="done-panel" class="done-panel" hidden></div>
    </section>

    <!-- ============ 수족관 ============ -->
    <section id="tab-aquarium" class="tab-panel" hidden>
      <div class="filter-bar">
        <label>날짜별 보기
          <select id="aquarium-date-filter"><option value="all">전체 보기</option></select>
        </label>
      </div>
      <div id="tank" class="tank"></div>
    </section>

    <!-- ============ 도감 ============ -->
    <section id="tab-dogam" class="tab-panel" hidden>
      <div class="filter-bar">
        <label>정렬
          <select id="dogam-sort">
            <option value="newest">최신순</option>
            <option value="oldest">날짜순 (오래된 순)</option>
          </select>
        </label>
        <label>그린 사람
          <select id="dogam-who">
            <option value="all">둘 다</option>
            <option value="A">A</option>
            <option value="B">B</option>
          </select>
        </label>
      </div>
      <div id="dogam-grid" class="dogam-grid"></div>
    </section>
  </main>

  <!-- 하단 탭바 -->
  <nav class="tabs">
    <button type="button" class="tab-btn active" data-tab="today">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21l1-4L17.3 3.7a2.1 2.1 0 0 1 3 3L7 20l-4 1z"/></svg>
      <span>오늘의 그림</span>
    </button>
    <button type="button" class="tab-btn" data-tab="aquarium">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 12c2.5-3.5 6-5.5 9.5-5.5 1.8 3.5 1.8 7.5 0 11C13 17.5 9.5 15.5 7 12z"/><path d="M7 12L2.5 8.5v7L7 12z"/><circle cx="14" cy="10.5" r="0.8" fill="currentColor" stroke="none"/></svg>
      <span>수족관</span>
    </button>
    <button type="button" class="tab-btn" data-tab="dogam">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1"/><rect x="13.5" y="3.5" width="7" height="7" rx="1"/><rect x="3.5" y="13.5" width="7" height="7" rx="1"/><rect x="13.5" y="13.5" width="7" height="7" rx="1"/></svg>
      <span>도감</span>
    </button>
  </nav>

  <!-- 그림 확대 모달 -->
  <div id="modal" class="modal" hidden>
    <div class="modal-box">
      <button type="button" class="modal-close" title="닫기" aria-label="닫기">✕</button>
      <div class="modal-img-wrap"><img id="modal-img" alt="그림 확대 보기"></div>
      <h3 id="modal-topic" class="modal-topic"></h3>
      <p id="modal-meta" class="modal-meta"></p>
    </div>
  </div>

  <!-- 프로필 선택 오버레이 -->
  <div id="profile-overlay" class="modal profile-overlay" hidden>
    <div class="modal-box profile-box">
      <h2>어서 오세요!</h2>
      <p class="hint">누구인지 골라주세요. 이름은 비워두면 A / B로 표시돼요.</p>
      <div class="profile-row">
        <div class="profile-col">
          <input type="text" id="name-a" maxlength="10" placeholder="이름 (예: 콩이)">
          <button type="button" class="profile-card card-a" data-user="A">나는 A</button>
        </div>
        <div class="profile-col">
          <input type="text" id="name-b" maxlength="10" placeholder="이름 (예: 두부)">
          <button type="button" class="profile-card card-b" data-user="B">나는 B</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Firebase 설정 (선택): firebase-config.example.js 를 복사해 firebase-config.js 로 만들면 공유 모드가 켜집니다 -->
  <script src="firebase-config.js"></script>
  <script src="js/topics.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/canvas.js"></script>
  <script src="js/aquarium.js"></script>
  <script src="js/dogam.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
